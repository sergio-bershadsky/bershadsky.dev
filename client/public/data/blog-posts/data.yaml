- id: 46
  slug: comprehension-debt-boundaries-beat-willpower
  title: "Comprehension Debt: Boundaries Beat Willpower"
  excerpt: "You can't out-read a machine writing a thousand lines an hour. Plugin contracts are the only comprehension strategy that survives code you didn't write."
  recap: |
    Working memory holds roughly two to six chunks, and the expert advantage is compression rather than
    capacity, so reading harder was never going to scale against a writer emitting a thousand lines an
    hour — longer checklists and a second approver are promises, and a promise has no throughput and
    renegotiates itself at six on a Friday. Parnas in 1972, Evans' bounded contexts, and Team
    Topologies' cognitive-load sizing are one idea: the boundary is where comprehension gets compressed.
    That contracts substitute for reading is already proven at scale by VS Code's deliberately narrow
    extension API and Yarn's plugin core, where new contributors ship features without knowing the
    core's subtleties — but the discount is earned only when the contract carries types, hooks, and
    invariants; miss the invariants and consumers read the implementation anyway. Making a boundary bind
    instead of inform takes about a dozen lines of eslint-plugin-boundaries or dependency-cruiser
    config, ArchUnit on the JVM, turning a ui import of core/internals into exit 1 rather than a review
    hope, and redefines understood as every module behind a contract with an owner who can explain it
    and a gate that goes red.
