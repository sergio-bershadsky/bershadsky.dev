- id: 47
  slug: comprehension-debt-specs-with-a-failing-state
  title: "Comprehension Debt: Specs With a Failing State"
  excerpt: "A spec that can't fail is an opinion with a heading. The industry put $125M and 93k GitHub stars behind fixing that."
  recap: |
    Strip the vendor language and a spec is three things — a document, a runner, and an exit code — and
    removing any leg of that tripod puts you back in documentation, which drifts into fiction precisely
    because nothing breaks when it lies. The 2025–26 wave splits into two camps with opposite arrows and
    one shared component: Living Documentation derives docs from the code so drift is structurally
    impossible, though it can only describe what already shipped, while GitHub's Spec Kit at 93,000
    stars, Kiro's EARS acceptance criteria, OpenSpec's validated delta-specs, and Tessl's $125M bet on
    code as regenerable build output make intent the durable artifact instead. Each enforces less than
    its landing page implies — Spec Kit enforces process order, Kiro the shape of a requirement,
    OpenSpec the structure of a change, and nobody enforces semantics end to end. For a codebase that
    already exists the entry price is two moves: arm the OpenAPI file that has been quietly lying since
    some Tuesday with a contract test, and require a scenario-bearing delta-spec on new work only, so
    coverage follows change instead of chasing it.
