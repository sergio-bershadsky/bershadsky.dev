- id: 26
  slug: case-study-ida
  title: "IDA - From Deployment Chaos to 99.9% Uptime"
  series_display_title: "Case Study"
  excerpt: "How we stabilized a failing deployment pipeline and achieved 99.9% uptime for an international driving permit service, reducing deployment failures by 90%."
  recap: |
    International Drivers Association's 2021 release process was SSH by hand, server configuration
    living in two senior developers' heads, tests nobody ran, no parity between development and
    production, and rollback meaning restore from backup and pray — so the team batched changes for
    weeks rather than risk another incident. The fix was four sequenced phases over eight months instead
    of one ambitious program: Docker first, which took environment-related bugs to zero within two weeks
    and converted the skeptics; then Terraform for every EC2 instance, RDS database and security group;
    then a Jenkins pipeline that rejects any build failing unit tests, integration tests or dependency
    scans; then CloudWatch, Sentry and PagerDuty so production was actually visible. Deploy time fell
    from 45 minutes to 8, uptime moved from roughly 95% to 99.9%, deployment-related incidents dropped
    90%, and MTTR went from hours to minutes. The cultural result outlasted the metrics — Friday freezes
    became unnecessary, new hires deploy to staging on day one — and the diagnosis generalizes: Django,
    Wagtail and AWS were never the problem, so the infrastructure failure was a process failure in
    disguise.
