- id: 34
  slug: zero-trust-what-it-is
  title: "Zero Trust: What It Actually Is"
  excerpt: "Where does verification finally terminate — at a brain, or at a quorum? A philosophical look at the last perimeter of trust."
  recap: |
    Zero Trust taken at its word is recursive verification, and a recursion has to terminate somewhere —
    the classical answer bottoms out in a human who knows something nobody else does, the only secret in
    the system no policy engine can enumerate. That root fails three ways: you cannot demonstrate
    knowledge of a passphrase without leaking it to silicon, brains forget and die and can be coerced,
    and Wittgenstein's private-language argument takes apart the idea that a string is a passphrase
    without a community that recognises the act. The mature move is to make the terminal plural —
    Shamir's 1979 secret sharing, M-of-N multisignature, the USAF's 1962 two-person rule on Permissive
    Action Links — the same doctrine in three media: a judgment with that blast radius is not in any
    single mind's gift. One brain authenticating to itself is fine for small blast radius, but "we trust
    our CTO" is a perimeter statement drawn at exactly one skull, and the engineer who can deploy to
    production alone at 3 a.m. is a single point of failure the diagram never shows.
  date: "2026-01-14"
