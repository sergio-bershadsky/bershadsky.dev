- id: 22
  slug: second-brain-meeting-memory
  title: "Second Brain: Meeting Memory"
  excerpt: "Three weeks ago, we definitely discussed the API changes. What did we decide? Nobody remembers. Turn every meeting into searchable, permanent context."
  recap: |
    A transcript is not memory — it exists, nobody re-reads it, and "what did we decide about the API
    three weeks ago?" still has no answer. A transcribe skill closes that gap: it pulls the raw
    transcript over MCP, checks meeting_id against tracking data so nothing is processed twice, writes a
    markdown document with searchable frontmatter (date, participants, topic, meeting_id, duration) over
    five fixed sections — context, discussion, decisions, action items, open questions — and then offers
    each technical conclusion as an ADR candidate for confirmation. Start with triggered processing,
    listing unprocessed meetings and naming the one you want, until the output is tuned; promote only
    high-value recurring meetings to automatic and leave casual ones unprocessed. The payoff is
    chain-shaped and compounds — three months in you have a searchable archive, a year in a new hire can
    reconstruct why the API looks like this: REST versus GraphQL debated in November, ADR-0012 a week
    later, caching raised in December, the v2 timeline set in January planning.
