- id: 41
  slug: secondbrain-db-virtual-fields
  title: "SBDB: Virtual Fields"
  excerpt: "Stop typing the title twice. Starlark virtual fields compute frontmatter from the markdown body — sandboxed, deterministic, and loud when they lie."
  recap: |
    The title is already in the file as the first H1, and maintaining a second copy in frontmatter is
    why half your dashboard rows say Untitled. A virtual field fixes that by being an ordinary schema
    property with readOnly true plus an x-compute block naming a Starlark function that sbdb calls as
    compute(content, fields) on every write — three lines for title, one expression for word_count, a
    regex for jira_refs whose items.pattern then type-checks the output so the virtual cannot lie to the
    index. The sandbox is the load-bearing part: no filesystem, no network, no import, no clock, no
    cross-document reads, just re and the string and collection builtins, which makes every virtual a
    pure function of its two arguments, cacheable, verifiable by doctor, and harmless when hostile. Type
    violations fail loud at write time — returning str(len(...)) for an integer field names the schema,
    the field and the file, and rejects the write atomically with nothing moved on disk — while facts
    about events, cross-document counts, and editorial fields like summary are exactly the cases that
    stay hand-written.
