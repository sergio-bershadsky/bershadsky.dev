- id: 37
  slug: cloud-agnostic-thinking
  title: "Agnostic Way: Thinking Cloud-Agnostic"
  excerpt: "The mindset, what it actually buys you, and the three exit costs nobody priced in."
  recap: |
    Most cloud-agnostic architectures fail because they confuse abstraction with optionality — paying an
    abstraction tax forever to buy an option nobody ever exercises. The discipline that survives contact
    is narrower: write the exit cost next to every dependency, in the same architecture doc that records
    why you adopted it, and know which of three points each workload sits on — portable (one Friday),
    lift-and-shift-able (days to weeks), vendor-locked-by-default (fiscal quarters). Agnosticism buys
    negotiation leverage at renewal, regulatory survival when the next data-residency deadline lands,
    and talent mobility; if none of the three applies — small spend, calm jurisdiction, junior team —
    use the managed service, name the price, revisit in a year. The costs nobody prices into the
    original decision are terabyte-scale egress that becomes a five-figure line item before the rewrite
    even starts, IAM rewiring that teaches you in week three that the cloud is the IAM layer, and SLA
    fine print that does not port even when the uptime number matches.
