- id: 18
  slug: second-brain-hooks
  title: "Second Brain: Automatic Behaviors"
  excerpt: "Skills wait for you to call them. Hooks don't wait — they just happen. Learn to create automatic triggers that catch your blind spots before they become problems."
  recap: |
    Skills are pull, hooks are push — you invoke a skill, but a hook fires itself on an event (session
    start, before or after a tool call, on file write, at session end) and decides on its own whether to
    say anything at all. Four earn their place: a session-start briefing that flags documentation older
    than 30 days and pending reviews, an after-write check that a newly created markdown file actually
    landed in the navigation config, a session-end reminder listing uncommitted files, and a rare
    before-tool-use guard on destructive commands. Implementation is either a small Python function
    returning a list of one-line reminders or a plain prompt hook in hooks/ that just describes the
    checks in prose, which covers most cases without code. What keeps hooks tolerable is silence — no
    "all checks passed" noise, warnings rather than blocks, one line per issue, easy override — because
    a hook that fires constantly gets switched off, and a switched-off hook protects nothing.
  date: "2024-12-29"
