- id: 49
  slug: comprehension-debt-the-monday-playbook
  title: "Comprehension Debt: The Monday Playbook"
  excerpt: "Six moves, no rewrite required, that start paying down comprehension debt while the feature train keeps running — beginning Monday."
  recap: |
    Six moves over twelve weeks pay down comprehension debt with no rewrite and no feature freeze, each
    shipping with an owner, a mechanism, and a metric — a move missing one of the three is a listicle
    entry. Start by baselining three numbers you already have, time-to-confident-change, orphan-module
    count and surprise rate, since METR found developers believing they were 20% faster while measuring
    slower, so self-report is precisely the instrument this problem breaks. Then give every module a
    named human who can explain it, in-repo next to CODEOWNERS, with explain-back review as the antidote
    to the 17% comprehension drop Anthropic measured in AI-assisted engineers; ratchet boundary rules on
    changed files only, aimed at GitClear's collapse of refactoring from 24.1% to 9.5% against an 8x
    rise in duplicated blocks; gate new decisions as typed entities that validate in CI while the old
    wiki goes read-only and is mined opportunistically; and put the rules file on an expiry-date diet.
    The sixth move keeps the other five alive by reserving a defended slice of every cycle and reporting
    it beside velocity, because what gets measured next to velocity gets protected from it.
