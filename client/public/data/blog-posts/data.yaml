- id: 35
  slug: zero-trust-pgp-sops
  title: "Zero Trust: Secrets When You Trust Nobody (PGP + SOPS)"
  excerpt: "Commit real secrets to git — encrypted well enough that the repo can be public. PGP and SOPS for the working engineer, plus an honest map of where the trust boundary actually moves."
  recap: |
    Committing a production database password to git is fine once a clone is useless to anyone outside
    the recipient list — the encryption becomes a perimeter that travels with the file instead of one
    you provision around it. SOPS makes that workable by encrypting only the values and leaving the keys
    readable, so a diff still tells you whether a change was a rotation or a hostname typo; a fresh
    per-file AES-256 data key encrypts every value, and that DEK is wrapped once per PGP recipient in
    the sops trailer — the same envelope trick TLS uses for session keys. Onboarding is one command,
    sops updatekeys, which rewraps the DEK and leaves the ciphertext bytes untouched, so the reviewer
    sees exactly one thing happen; offboarding is the same shape, but recipient rotation only answers
    future access, and historical compromise still requires rotating the secret itself. Three trust
    assumptions remain and you should be able to name them on demand: the recipient list needs branch
    protection, the CI identity can read everything and belongs in a short-lived KMS role rather than a
    PGP key on a Jenkins box, and PGP-only setups give you no audit log at all.
  date: "2026-02-04"
