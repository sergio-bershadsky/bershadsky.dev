- id: 20
  slug: second-brain-memory-layer
  title: "Second Brain: The Memory Layer"
  excerpt: "Your second brain has skills and hooks. But ask it \"how many decisions did we make last month?\" and it has to read every file. There's a better way."
  recap: |
    Markdown is excellent for reading and terrible for querying — "show me December decisions still
    pending" means opening fifty files, parsing each one, and hoping the format held, against a single
    structured read and an instant filter. The tracking layer is YAML for data and JSON Schema for
    validation, a database that lives in the git repository, governed by four rules: start minimal
    (number, title, status, created, file — not id, created_at, updated_at, created_by, status_history),
    make every field answer a question you can state out loud, denormalize so a discussion record
    carries participant names instead of ids that must be chased across files, and spell names out
    because abbreviations save bytes and cost hours. Decisions live in one records.yaml with a
    last_number counter, discussions partition by month as 2024-01.yaml, and the schema enums status to
    draft, proposed, accepted, implemented, rejected so a typo fails validation before it is written.
    Schema drift is expected rather than avoided — add optional fields, stamp a schema_version in
    config.yaml, or run a small migration script.
  date: "2024-12-30"
