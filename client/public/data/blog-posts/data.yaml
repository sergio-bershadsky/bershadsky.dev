- id: 36
  slug: zero-trust-immutability-as-proof
  title: "Zero Trust: Immutability as Proof"
  excerpt: "Append-only streams, hash chains, and the past you cannot unhack. The third trust shift: stop trusting the storage layer to be honest about its own history."
  recap: |
    A database row is a cached projection, not a fact — current state is a fold over an event stream the
    storage layer hides for performance reasons that have nothing to do with truth. Make the log primary
    and the state derived, and tampering stops being silent: in a hash chain where each block is the
    hash of the previous hash concatenated with the event, one flipped bit cascades to the head, and ten
    lines of Python show the two heads diverging. Git has given source code that property for fifteen
    years, and the same primitive covers data through Kafka topics with infinite retention,
    event-sourced aggregates with a monotonic sequence, or S3 Object Lock that even admin credentials
    cannot rewrite before retention expires; Merkle roots plus signed checkpoints anchored out-of-band
    extend the proof to an auditor who never reads the log and never trusts your servers. Blockchains
    are one expensive instantiation and almost never the right first reach — what you get instead is a
    post-mortem that ends in "chain broke at block 4,712, head diverged from the 02:14:08 checkpoint"
    rather than one that ends in "we believe."
