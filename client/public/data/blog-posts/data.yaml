- id: 40
  slug: secondbrain-db-integrity-signing
  title: "SBDB: Integrity Signing"
  excerpt: "Per-file hashes, three flavours of drift, and a `doctor` command that makes silent edits loud."
  recap: |
    Discipline is what already failed at keeping a wiki honest, so sbdb gives every managed doc a
    five-field sidecar — a sha256 over canonicalised content, the schema version in force at write time,
    last_seen, the writer binary version, and the list of fields it normalised — and rehashes on every
    read. This is drift detection, not signing: anyone with repo write access can edit the file and the
    sidecar together, and that case belongs to branch protection and signed commits. What it does catch
    is the frequent category, and doctor names three flavours because the correct response differs —
    hand-edit drift heals safely because a human is at the keyboard, agent-rewrite drift gets a
    Stop-hook running sbdb doctor heal --all --schema-validate so the agent reads its own damage in the
    next prompt window, and merge residue is flagged cause merge_residue and refuses to heal without
    --force rather than bless a resolution nobody reviewed. Per schema, x-integrity strict fails CI,
    warn is a migration scaffold teams stay on for eighteen months, and off is defensible only for
    disposable notes.
