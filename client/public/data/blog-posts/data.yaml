- id: 42
  slug: secondbrain-db-knowledge-graph
  title: "SBDB: The Knowledge Graph"
  excerpt: "Foreign keys for markdown — typed `$ref` edges, prose-link edges, a local SQLite index, and reverse-link queries in milliseconds."
  recap: |
    Every wiki renders a forward link and forgets how to follow a backward one, which is the whole
    problem, and sbdb solves it with two extraction passes into one edges table of from_id, to_id, kind,
    source_field and label. Pass one walks the schema: a $ref pointing at
    sbdb://incidents#/properties/id is simultaneously a string constraint to a stock validator and a
    named typed edge to the indexer, so supersedes chains and ownership ties get declared rather than
    regexed, and a dangling reference becomes a validation error the way a missing import is a compile
    error. Pass two walks the prose, turning every resolvable markdown link into a mentions edge with
    the link text as label — deliberately keeping the duplicate row when frontmatter and body both point
    at the same incident, because the prose remembers why the link was made. The index is three tables
    in .sbdb/index.sqlite, disposable and rebuilt from the files; a 3,400-document, 28,000-edge archive
    reindexes in 1.3 seconds, and sbdb links --to answers what points at this before you delete it.
