- id: 15
  slug: second-brain-your-first-entry
  title: "Second Brain: Your First Entry"
  excerpt: "Stop reading about second brains. Let's build something in the next 10 minutes and experience the magic moment when your AI actually remembers."
  recap: |
    The threshold for writing something down is mechanical rather than aspirational — if you have
    explained it more than twice, it deserves a document — and the first entry should be deliberately
    boring: dev environment setup, naming conventions, the commands you keep re-googling, not the
    comprehensive architecture doc you will never finish. The writing loop takes about ten minutes and
    inverts the usual burden: you dictate what you already say out loud, Claude structures it into
    markdown, you correct the gaps, and it lands at a real path like docs/guides/dev-setup.md. The proof
    is the second session — open a fresh conversation, ask how to set up the dev environment, and the
    answer comes back from your own file rather than from generic training data, which is the point at
    which the system stops being theory. What stays out matters equally: one-off tasks, trivial fixes,
    and personal preferences are noise, and treating every keystroke as documentation is how the
    graveyard folder gets built.
