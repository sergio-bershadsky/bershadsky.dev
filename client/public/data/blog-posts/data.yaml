    paying for its own shape: every function opened its own RDS MySQL connection on cold start, a custom
    authorizer re-validated identical JWTs thousands of times per session, and the stored procedures
    passed everything as JSON with no compile-time checking. V2 went after all three at once — secrets
    and connection caching on a 5-minute TTL, JWT results cached in ElastiCache Redis aligned to the API
    Gateway authorizer window, SSL certificates preloaded during init, and typed procedures with
    generated, type-annotated wrappers replacing the JSON interfaces. Warm DB connection time fell from
    150ms to 80ms, cached authorizer latency from 200ms to 60ms, cold starts from 3.5s to 2.1s, and P95
    API response from 850ms to 450ms. The transferable point is that connection pooling, secrets
    caching, and certificate preloading are not optimizations in serverless; they are the entry price
    for running a database-backed Lambda fleet in production.
