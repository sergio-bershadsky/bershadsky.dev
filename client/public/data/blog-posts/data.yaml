- id: 27
  slug: case-study-moxy
  title: "Moxy - Building a Play-to-Earn Gaming Platform from Zero"
  excerpt: "How we built scalable cloud infrastructure from scratch for Moxy's gaming platform. 99.99% uptime, 10,000+ concurrent users, sub-200ms latency globally."
  recap: |
    Live tournament traffic defeats ordinary capacity planning: roughly 500 baseline users, 10,000+
    concurrent within minutes of an event opening, another surge on a critical play everyone wants to
    watch at once, then a rapid collapse back to baseline — which leaves over-provisioning as the
    expensive answer and under-provisioning as the broken one. Building Moxy's play-to-earn platform
    from zero AWS resources, the calls were Kubernetes on EKS from day one rather than simpler
    orchestration to migrate off later, every resource down to IAM policies defined in Terraform so
    disaster recovery is a terraform apply in a new region, and two caching layers — CloudFront at the
    edge, ElastiCache in the application — holding latency under 200ms globally. The first real event
    settled it: 8,000 concurrent users and climbing, a 25% spike in thirty seconds, the autoscaler
    adding pods, not a single error in the logs. The argument worth carrying is that early architectural
    decisions are the cheapest ones a company ever makes — 99.99% uptime, 75% faster deployments and 40%
    saved against an over-provisioned baseline were bought in month one, and none of them could have
    been retrofitted in year three.
