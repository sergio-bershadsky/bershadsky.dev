- id: 39
  slug: secondbrain-db-typed-schemas
  title: "SBDB: Typed Schemas"
  excerpt: "A copy-pasteable JSON-Schema 2020-12 contract for every markdown file in your repo, plus the small `x-*` vocabulary that turns the schema into an ORM."
  recap: |
    The schema is the layer every other sbdb feature leans on, and it is stock JSON Schema 2020-12 in
    schemas/*.yaml — ajv validates it, yaml-language-server autocompletes your frontmatter from it, and
    everything sbdb-specific hides behind one greppable x- prefix. Thirty lines for a recipes entity
    buys additionalProperties false so prep_tme fails outright, an enum that collapses six spellings of
    japanese into one token, defaults that sbdb create fills in, and a $ref like
    sbdb://people#/properties/id that does double duty as both type constraint and a foreign-key edge in
    the graph. Validation failure prints the JSON Pointer, the schema location that rejected it, and a
    one-line fix at a stable exit code 2, which is what makes the CLI usable by an agent that checks $?
    instead of parsing English. Evolution runs on x-schema-version — additive changes like a new
    optional property or a widened enum never bump it, breaking changes ship an x-migrations descriptor
    that sbdb schema migrate --dry-run walks over every record before rewriting anything.
