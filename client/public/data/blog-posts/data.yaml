- id: 13
  slug: second-brain-concept
  title: "Second Brain: Concept"
  excerpt: "Learn what a \"second brain\" really means and why your AI assistant deserves a memory upgrade."
  recap: |
    Knowledge fragments across Notion, Slack threads, and Google Docs, and the bill arrives as the
    "where did I put that" tax — some studies put it near 20% of a knowledge worker's day — while the AI
    assistant makes it worse rather than better, since every session starts from zero like a brilliant
    consultant with complete amnesia. A second brain closes that loop — not another app to dump notes
    into, but a store the assistant reads, so "what did we decide about the API redesign" comes back
    with the decision, the alternatives you rejected, and the discussion that led there. Two paths reach
    it: VitePress plus Git, where knowledge is plain text under version control and you own all of it,
    or Notion, gentler and already collaborative but thin on version history and offline access. The
    technical path asks for Claude Code, enough command line to type cd and ls without panicking, and
    about 30 minutes of setup, and returns speed, hackability, and integration room the hosted path
    cannot match.
