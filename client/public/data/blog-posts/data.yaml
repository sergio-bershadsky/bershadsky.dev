- id: 14
  slug: second-brain-core-building-blocks
  title: "Second Brain: Core Building Blocks"
  excerpt: "The three pillars that make a second brain actually work: current knowledge, historical record, and decision archive."
  recap: |
    Note systems rot into graveyards of final_v3_ACTUALLY_FINAL because they are organized by date
    instead of by purpose, and the fix is three separate pillars answering three different questions —
    current knowledge for how we do things now, historical record for what we discussed, decision
    archive for why we chose. Each behaves differently: living docs change constantly and are written
    for reuse, discussion records are frozen the moment they are written, and decision records carry
    context, the options considered, the ones rejected and why, plus a lifecycle from proposed to
    accepted to implemented. They chain in one direction — a discussion about a slow API becomes a
    decision to use Redis over Memcached, which becomes a setup guide — so "why Redis?" has three layers
    of answer instead of a shrug, and a new teammate reads their way in over two hours rather than two
    weeks of interviews. The concrete form is npm create vitepress plus three folders under docs:
    guides, discussions, decisions.
