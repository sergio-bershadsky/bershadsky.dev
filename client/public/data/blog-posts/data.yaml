- id: 19
  slug: second-brain-plugins
  title: "Second Brain: Sharing Knowledge with Plugins"
  excerpt: "Turn your personal automation into team infrastructure. One package, instant capability."
  recap: |
    Personal automation becomes team infrastructure the moment sharing stops being "here are five files,
    put them there, rename this one" and becomes claude plugin install. A plugin is a directory with
    plugin.json naming the skills/, hooks/, and agents/ it ships plus a README that serves as the first
    impression, and configuration keys with sensible defaults — standup_format brief or detailed,
    freshness_days 30, a channel that defaults to #general instead of a hardcoded #engineering — are
    what let it survive contact with a second team. Distribution is a three-way tradeoff: a Git
    repository gives version control and one-command updates but needs repo access, a local folder path
    works offline with no updates and version confusion, a team registry adds a central catalog, access
    control, and an audit trail at the cost of setup and maintenance, and a private Git repo is the
    right default for most teams. Precedence is worth knowing before names collide — project plugins
    beat team plugins beat personal ones — so a project can override a team default without forking it.
