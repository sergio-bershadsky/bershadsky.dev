- id: 44
  slug: comprehension-debt-the-debt-nobody-booked
  title: "Comprehension Debt: The Debt Nobody Booked"
  excerpt: "AI writes code faster than your team builds the theory of it. The gap is a debt, it compounds, and it isn't on any ledger your tools can see."
  recap: |
    Comprehension already consumed about 58% of professional developer time in 2018, three years before
    Copilot, measured by Xia et al. across 78 developers on seven industrial projects. Then generation
    went industrial: GitClear's 211-million-line analysis found duplicated blocks up 8x in 2024 and
    refactored lines collapsing from 24.1% to 9.5%; METR's trial had experienced developers 19% slower
    with AI while believing they were 20% faster; Anthropic's study scored AI-assisted engineers 17%
    lower on comprehension quizzes about code they had just shipped. Naur's 1985 Programming as Theory
    Building explains why volume is not the real problem — the product of programming is a theory held
    by the people who built it, one that degrades on serialization — so LLM output is code whose theory
    nobody ever formed, born legacy and pre-orphaned with green CI. That puts the cost on a different
    ledger from technical debt, since it lives in people rather than the artifact, and the usable
    proxies are onboarding time to a first confident change, modules with zero humans who can explain
    them, and how often a trivial change detonates.
