    A second brain that only reads its own files is a consultant who refuses to check email, and MCP is
    the repair — small translator programs sitting between Claude and Slack, the task tracker, meeting
    transcripts, or the calendar, absorbing authentication and data formatting so no copy-paste is
    involved. Team chat is the right first connection because it carries the highest context density and
    fails loudly, which makes verification trivial: ask what happened in a channel today and you either
    get a summary or a flat admission of no access, at which point the checklist is server running,
    token valid, permissions granted, resource exists, tool visible. The payoff compounds across
