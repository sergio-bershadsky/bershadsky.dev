- id: 21
  slug: second-brain-communication-hub
  title: "Second Brain: Team Communication Hub"
  excerpt: "Monday morning. 47 unread messages. Somewhere in there is something important. Build a communication hub that filters signal from noise."
  recap: |
    Team chat is a firehose in which two real decisions hide among 47 messages of "lol", "coffee
    anyone?", and meeting reschedules. The hub that fixes it is assembly, not invention: an MCP
    connection for access to Slack or Discord, a recap skill that takes an hours argument (24 by
    default, 8 since this morning, 120 for the week) and categorizes on signal words like "decided to",
    "agreed on", "going with", "blocked", "waiting", and the tracking layer marking each processed time
    range so nothing is summarized twice or silently skipped. Channels carry a priority in config.yaml —
    high ones get full summaries, low ones only decision extraction — and every extracted decision is
    offered back as an ADR with title, owner, date, and source channel already populated, so a chat
    message becomes real documentation on one keystroke. Privacy is the part teams get wrong: capture
    work, not workers, which means explicit skip_channels, skip_patterns for salary and compensation,
    anonymize_dms, and telling people before you switch it on.
