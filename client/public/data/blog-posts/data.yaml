- id: 43
  slug: secondbrain-db-git-is-the-audit-log
  title: "SBDB: Git Is the Audit Log"
  excerpt: "Git is already an append-only ledger of every change you ever made — `sbdb events emit` projects it as a JSONL stream and stores zero new bytes."
  recap: |
    Git is already an append-only, hash-chained ledger of every change your team made, signed by
    committer and ordered by time, which makes the usual audit stack — events table, relay worker, queue
    — six engineer-weeks spent building a worse version of it, plus a second truth that drifts the
    moment a backfill script writes to the table directly. sbdb events emit walks git log over a commit
    range, classifies each touched file by entity against the schema's path globs, and prints one JSONL
    line per change, shaped by an x-events block that whitelists frontmatter fields so bodies never leak
    onto the audit bus; it stores zero new bytes. Because the projection is deterministic over the same
    history, replay is just a different range — the standup window, the weekly compliance dump, the
    regulator's question six months later all return byte-identical output. The honest limit is that git
    is not Kafka: latency is measured in pushes, with no per-consumer offsets, which is the right trade
    at the tens-to-thousands-of-events-per-day rate a knowledge base actually produces.
