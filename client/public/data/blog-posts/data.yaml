- id: 45
  slug: comprehension-debt-frozen-context
  title: "Comprehension Debt: Frozen Context"
  excerpt: "Your knowledge base is a snapshot of a theory nobody re-verifies. Markdown can't fail — and that's precisely why it drifts into fiction."
  recap: |
    AGENTS.md, CLAUDE.md, Cline's Memory Bank, glob-scoped ADRs — every vendor converged on one
    architecture, serialize the team's theory into prose and inject it into every context window, and it
    decays three ways. Chroma's context-rot study across 18 frontier models found performance degrading
    non-uniformly as input length grows; instruction files only ever grow, because nobody is sure a rule
    is safe to delete, until the agent ignores the file wholesale rather than selectively; and drift is
    the quiet one, a March CLAUDE.md still asserting that database access goes through lib/db.ts and
    GraphQL is banned, months after that file was deleted and GraphQL shipped, with zero errors raised.
    Underneath all three sits the property that markdown has no failing state: code that lies won't
    compile, tests go red, an OpenAPI spec that lies breaks its contract test, but prose that lies
    renders exactly like prose that tells the truth, and loading an ADR into a prompt is not enforcing
    it. Both escape routes — generating docs from code, generating code from specs — agree the fix is a
    verification loop, not better discipline, leaving prose the job it is genuinely good at: rationale,
    not enforcement.
