- id: 38
  slug: secondbrain-db-overview
  title: "SBDB: Your Markdown IS Your Database"
  excerpt: "Markdown files are structured data wearing prose's clothes. `sbdb` is the smallest tool that lets you stop pretending otherwise."
  recap: |
    A markdown directory is a database that nobody admits to running: the frontmatter is typed columns,
    the body is the payload, the wikilinks are foreign keys, and the schema is enforced by nobody. That
    denial produces four quiet rot modes once the file count crosses a thousand — frontmatter drift
    where half the files say tags and the rest say keywords, silent edits nobody reviews, link rot that
    never fails loudly, and inventory loss where counting proposed ADRs requires writing a script every
    time. secondbrain-db is one static Go binary that layers five thin things over the same directory
    without taking it away: schemas in JSON-Schema 2020-12 with x-storage and x-entity extensions, .sbdb
    sidecars holding sha256 integrity hashes, Starlark virtual fields, a SQLite-backed link graph, and
    git log projected into typed JSONL events. There is no daemon and no sbdb serve — the state is the
    directory plus the SQLite file, and deleting the binary leaves a normal repo of normal markdown
    behind.
