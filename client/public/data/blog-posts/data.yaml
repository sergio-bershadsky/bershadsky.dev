- id: 48
  slug: comprehension-debt-metaframework
  title: "Comprehension Debt: Metaframework"
  excerpt: "Your product management tool is a database your repo has never heard of. Bring the product home — typed, validated, and able to fail CI."
  recap: |
    Code was born in version control, CI became YAML in the repo, infrastructure became Terraform
    reviewed like any other diff — and every one of those migrations delivered the same three gifts of a
    diff, a review, and a history. Product management is the holdout, so the decisions about what the
    system actually is sit in Linear or Jira or Notion, a vendor's database the repo cannot see, which
    is why agents get product context by copy-paste, paraphrased and three sprints stale. Bringing it
    home takes four properties: a stable address per entity, srn://billing/checkout/adr/psp-fallback
    resolving to one markdown file; a declared kind; a JSON Schema per kind; and a CI check that exits 1
    when the catalog lies — implemented in metaframework v0.1.0, where the filesystem is the database,
    git is the history, evolution is additive-only, and a 288-entity catalog re-reads in about 239 ms.
    The payoff is that a scope cut arrives as a reviewable diff instead of a comment thread, and asking
    when guest checkout was dropped becomes git blame on a file with a schema rather than archaeology
    across four tools.
