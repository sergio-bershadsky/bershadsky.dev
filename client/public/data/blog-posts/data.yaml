- id: 25
  slug: case-study-umias
  title: "UMIAS - From Dying Portal to National Healthcare Platform"
  series_display_title: "Case Study"
  excerpt: "How we transformed a 2,000 visitor news site into the world's largest medical booking app with 1.6M installs and 2M monthly appointments in just 3 years."
  recap: |
    A Moscow healthcare news portal drawing 1,000-2,000 monthly visitors, weeks from shutdown, became
    what McKinsey's Smart Cities 2018 report called the largest medical appointment booking app in the
    world — over 1 million monthly active users, 1.6 million installs, 2 million appointments a month.
    The wedge was friction, not features: after a full year online bookings had plateaued at 6% of all
    appointments because the state portal holding 93% share required registration and government
    identity verification first, so the news content was killed outright and every ruble redirected into
    one-click booking with a phone number as the only identifier, plus ReactNative apps while
    competitors still shipped shrunken desktop sites. Scale then broke things nobody designed for — slot
    matching across hundreds of clinics ran 2-3 seconds until Redis caching, indexes and district
    sharding pulled it under 200ms; the city HIS API's rate limits forced a batching queue that
    prioritized time-sensitive calls; Monday mornings arrived at 5-10x baseline. The transferable point
    is that a dying product can sit on a live market position, and the way in is to question the step
    everyone treats as mandatory.
