- id: 23
  slug: second-brain-decision-intelligence
  title: "Second Brain: Decision Intelligence"
  excerpt: "Why do we use this framework? Decisions without context become arbitrary rules. Decision intelligence makes the \"why\" permanent and queryable."
  recap: |
    Decisions decay on a predictable curve: in week one it's "Redis, because it handles our read
    patterns and the team has production experience," by month three it's "it was decided at some
    point," and by year one it's "that's just what we use" — and the bill arrives as the same debate
    relitigated every quarter and newcomers locked out of the history. An ADR only stops that if it
    records the rejected options, not just the chosen one — Memcached ruled out for no persistence,
    in-memory ruled out because it breaks across horizontally scaled instances, each with the conditions
    that would justify revisiting. The reversibility test decides what earns a record: if undoing it
    costs real time, money, or effort, write it down; if it's a ten-minute change, don't. Numbered
    ranges (0001-0999 architecture and infrastructure, 1000-1999 fork and upstream, 2000-2999 feature
    and product, 3000-3999 process) turn "show me every infrastructure decision" into a query, and once
    the records exist, "why do we use Redis?" answers itself with context, rationale, rejections, and
    the discussions that led there.
