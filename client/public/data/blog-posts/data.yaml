- id: 17
  slug: second-brain-teaching-skills
  title: "Second Brain: Teaching Skills"
  excerpt: "Your second brain knows facts. Now let's teach it how you actually work — turning repetitive tasks into one-command magic."
  recap: |
    Skills convert a paragraph-long prompt you retype every week into a single trigger like /standup or
    /weekly-recap, and the crucial detail is that they are written in plain language, not code — a
    SKILL.md file stating when to use it, numbered steps to follow, and the exact output shape, with
    Claude working out the how. A standup skill reads yesterday's commits and moved issues, pulls
    in-progress work and calendar entries for today, flags what you are waiting on, then formats three
    sections capped at two or three bullets each; the same file produces the same structure every run,
    which is the whole point. Four patterns cover almost everything worth automating — gather, generate,
    analyze, automate — mapping to /catchup, /standup, /review, /release. The sorting rule is blunt: if
    someone could follow the written steps mechanically it is a skill, and if the work needs judgment at
